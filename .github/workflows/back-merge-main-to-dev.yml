# Keeps `dev` in sync with `main` by merging main into dev after every push to main.
# On a merge conflict the run fails without force-pushing, so it can be resolved manually.

name: Back-merge main to dev

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: back-merge
  cancel-in-progress: false

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin dev
