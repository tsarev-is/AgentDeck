name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        run: |
          VERSION=$(dotnet msbuild src/AgentDeck/AgentDeck.csproj -getProperty:VersionPrefix)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test src/AgentDeck.Tests/AgentDeck.Tests.csproj -c Release

      - name: Publish linux-x64
        run: >
          dotnet publish src/AgentDeck/AgentDeck.csproj
          -c Release -r linux-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -o publish/linux-x64

      - name: Publish win-x64
        run: >
          dotnet publish src/AgentDeck/AgentDeck.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -o publish/win-x64

      - name: Package
        run: |
          tar -czf AgentDeck-${VERSION}-linux-x64.tar.gz -C publish/linux-x64 .
          (cd publish/win-x64 && zip -qr "${GITHUB_WORKSPACE}/AgentDeck-${VERSION}-win-x64.zip" .)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Версия живёт в VersionPrefix и держится, пока её не поднимут руками, а
          # workflow идёт на каждый push в main: `gh release create` со второго
          # push падал бы с «release already exists». Релиз этой версии обновляем
          # на месте, а новый — создаём.
          ASSETS=("AgentDeck-${VERSION}-linux-x64.tar.gz" "AgentDeck-${VERSION}-win-x64.zip")

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "${ASSETS[@]}" --clobber
          else
            gh release create "v${VERSION}" "${ASSETS[@]}" \
              --title "AgentDeck v${VERSION}" \
              --generate-notes
          fi
