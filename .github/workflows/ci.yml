name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        run: |
          VERSION=$(dotnet msbuild src/AgentDeck/AgentDeck.csproj -getProperty:VersionPrefix)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test src/AgentDeck.Tests/AgentDeck.Tests.csproj -c Release

      - name: Publish linux-x64
        run: >
          dotnet publish src/AgentDeck/AgentDeck.csproj
          -c Release -r linux-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -o publish/linux-x64

      - name: Publish win-x64
        run: >
          dotnet publish src/AgentDeck/AgentDeck.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -o publish/win-x64

      - name: Package
        run: |
          tar -czf AgentDeck-${VERSION}-linux-x64.tar.gz -C publish/linux-x64 .
          (cd publish/win-x64 && zip -qr "${GITHUB_WORKSPACE}/AgentDeck-${VERSION}-win-x64.zip" .)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${VERSION}"
          "AgentDeck-${VERSION}-linux-x64.tar.gz"
          "AgentDeck-${VERSION}-win-x64.zip"
          --title "AgentDeck v${VERSION}"
          --generate-notes
